name: palm_reader

description: Premium AI palm reading frontend
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.1
  google_fonts: ^6.3.0
  animations: ^2.0.11
  flutter_hooks: ^0.21.3+1
  http: ^1.2.2
  http_parser: ^4.1.2
  image: ^4.3.0
  image_picker: ^1.1.2
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: '#070A1A'
  adaptive_icon_foreground: assets/images/app_icon.png
  remove_alpha_ios: true
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/images/app_icon.png
    background_color: '#070A1A'
    theme_color: '#D4AF37'
  windows:
    generate: true
    image_path: assets/images/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/images/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
